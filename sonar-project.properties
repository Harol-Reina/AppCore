# SonarQube properties for AppCore

# Project identification
sonar.projectKey=orionsoft_appcore
sonar.organization=orionsoft
sonar.projectName=AppCore
sonar.projectVersion=2.0.0

# Source and test directories
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/*Tests.cs,**/*Test.cs
sonar.exclusions=**/bin/**,**/obj/**,**/*.generated.cs

# Language
sonar.cs.analyzer.projectOutPaths=**/bin/**,**/obj/**

# Code coverage
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/**/*.trx

# Analysis parameters
sonar.sourceEncoding=UTF-8

# Quality gate
sonar.qualitygate.wait=true

# Duplicated lines
sonar.cpd.cs.minimumtokens=100

# Rules customization
# Exclude generated files and test files from certain rules
sonar.issue.ignore.multicriteria=e1,e2,e3

# Rule: "Utility classes should not have public constructors"
sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:S1118
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*Tests.cs

# Rule: "Track uses of "TODO" tags"
sonar.issue.ignore.multicriteria.e2.ruleKey=csharpsquid:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.cs

# Rule: "Nested blocks of code should not be left empty"
sonar.issue.ignore.multicriteria.e3.ruleKey=csharpsquid:S108
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*Tests.cs